<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared File - Telegram Cloud</title>
    <link href="css/style.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 850: '#151e2e' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex items-center justify-center p-4">

    <!-- Background Decor -->
    <div class="fixed top-[-20%] left-[-10%] w-[50%] h-[50%] bg-indigo-600/20 rounded-full blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-[-20%] right-[-10%] w-[50%] h-[50%] bg-blue-600/20 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="max-w-md w-full bg-slate-800/80 backdrop-blur-xl rounded-2xl shadow-2xl border border-slate-700 p-8 text-center relative z-10" id="main-card">
        
        <div id="loading" class="text-slate-400 animate-pulse">Loading file info...</div>

        <div id="file-info" style="display: none;">
            <div class="w-16 h-16 bg-indigo-500/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-indigo-500/30">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-white mb-2 break-all" id="filename">Filename.txt</h2>
            <p class="text-slate-400 mb-1" id="filesize">0 MB</p>
            <p class="text-slate-500 text-sm mb-6">Shared by <span id="ownername" class="font-medium text-slate-300">User</span></p>

            <div id="auth-check" class="hidden">
                <p class="text-slate-300 mb-4">Log in to save this file to your Cloud Storage.</p>
                <a href="/login.html" class="block w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition-colors border border-indigo-500 shadow-[0_0_15px_rgba(79,70,229,0.3)]">
                    Log In or Register
                </a>
            </div>

            <div id="save-section" class="hidden">
                <button id="save-btn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-medium transition-colors border border-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.3)] flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                    </svg>
                    Save to My Cloud Storage
                </button>
                <p id="save-msg" class="mt-4 text-sm hidden"></p>
            </div>
        </div>

        <div id="error-info" style="display: none;">
            <div class="text-red-400 mb-4">
                <svg class="w-12 h-12 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <h2 class="text-xl font-bold text-white mb-2">File Not Found</h2>
            <p class="text-slate-400" id="error-msg">This link is invalid or has expired.</p>
        </div>

    </div>

    <script src="js/share.js"></script>
</body>
</html>
