<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="card">
    <div class="mark"><span class="dot"></span><span>telegram-cloud / log in</span></div>
    <h1>Welcome back</h1>
    <p class="subtitle">Log in with your name and password.</p>

    <form id="login-form" novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <div id="error-box" class="error-box"></div>

      <button type="submit" id="submit-btn">Log in</button>
    </form>

    <div class="footer-link">Need an account? <a href="/register.html">Register</a></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');
    const submitBtn = document.getElementById('submit-btn');

    // Check if already logged in
    fetch('/api/me').then(res => {
      if (res.ok) window.location.href = '/dashboard.html';
    });

    if (params.get('registered') === '1') {
      errorBox.textContent = 'Account created. You can log in now.';
      errorBox.classList.add('success');
      errorBox.classList.add('visible');
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.remove('success');
      errorBox.classList.add('visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in…';

      const payload = {
        name: document.getElementById('name').value.trim(),
        password: document.getElementById('password').value,
      };

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (res.ok) {
          window.location.href = '/dashboard.html';
          return;
        }

        const data = await res.json().catch(() => ({}));
        showError(data.detail || 'Login failed. Please try again.');
      } catch (err) {
        showError('Could not reach the server. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log in';
      }
    });
  </script>
</body>
</html>
