<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="card">
    <div class="mark"><span class="dot"></span><span>telegram-cloud / log in</span></div>
    <h1>Welcome back</h1>
    <p class="subtitle">Log in with your name and password.</p>

    <form id="login-form" novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <div id="error-box" class="error-box"></div>

      <button type="submit" id="submit-btn">Log in</button>
    </form>

    <div class="footer-link">Need an account? <a href="/register.html">Register</a></div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
